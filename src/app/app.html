<div
  class="app-layout"
  [class.sidebar-collapsed]="isSidebarCollapsed">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      <span class="logo-icon">🚑</span>
      <span class="logo-text">
        Vehicle System
      </span>
    </div>

    <ul class="menu">

      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          🏠 หน้าหลัก

        </a>
      </li>

      <li>
        <a
          routerLink="/vehicles"
          routerLinkActive="active">

          🚗 รายการรถ

        </a>
      </li>

      <li>
        <a
          routerLink="/approval"
          routerLinkActive="active">

          📋 อนุมัติ

        </a>
      </li>

      <li>
        <a
          routerLink="/reports"
          routerLinkActive="active">

          📊 รายงาน

        </a>
      </li>

      <li>
        <a
          routerLink="/settings"
          routerLinkActive="active">

          ⚙️ ตั้งค่า

        </a>
      </li>

    </ul>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <!-- Topbar -->
    <nav class="topbar">

      <div class="topbar-left">

        <button
          class="menu-btn"
          (click)="toggleSidebar()">

          ☰

        </button>

        <h4 class="page-title">
          ระบบรับรองพาหนะ
        </h4>

      </div>

      <div class="user-profile">

        <div class="avatar">
          A
        </div>

        <div>
          <div class="fw-bold">
            Admin
          </div>

          <small>
            Administrator
          </small>
        </div>

      </div>

    </nav>

    <!-- Content -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
